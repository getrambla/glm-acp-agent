name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check registry manifest version sync
        run: node dist/registry/sync-manifest.js --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Bunx smoke test (packed tarball)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          VERSION=$(node -p "require('./package.json').version")
          TMPDIR=$(mktemp -d) bun x --package "$RUNNER_TEMP/glm-acp-agent-$VERSION.tgz" glm-acp-agent < /dev/null

  sync-dist:
    needs: build
    # dist/ is committed so npx can install straight from GitHub.
    # Rebuild it here and commit the result so main never goes stale.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-dist-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Full history + credentials so the bot can push a follow-up commit.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit rebuilt dist if it differs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ is up to date; nothing to commit"
            exit 0
          fi
          git commit -m "chore(dist): rebuild from ${{ github.sha }}"
          git push
          echo "::notice::dist/ was stale; committed a rebuild. Run 'git pull' before your next push."
